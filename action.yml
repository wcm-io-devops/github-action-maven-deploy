name: Maven Deploy
description: Composite GitHub Action that deploys Maven artifacts.

inputs:
  java-version:
    description: Java version
    required: true
  java-distribution:
    description: Java distribution
    required: false
    default: temurin
  maven-executable:
    description: Maven executable
    required: false
    default: mvn    
  maven-deploy-args:
    description: Maven goals and command line parameter to deploy the build
    required: false
    default: -s ./.maven-settings.xml -Pcontinuous-integration -B -U clean deploy
  maven-additional-args:
    description: Additional maven goals or command line parameters to be added to all maven calls
    required: false
  sonatype-username:
    description: SONATYPE_USERNAME secret
    required: true
  sonatype-password:
    description: SONATYPE_PASSWORD secret
    required: true

runs:
  using: composite

  steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Setup JDK
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        cache: maven

    - name: Build and deploy
      env:
        SONATYPE_USERNAME: ${{ inputs.sonatype-username }}
        SONATYPE_PASSWORD: ${{ inputs.sonatype-password }}
      run: ${{ inputs.maven-executable }} ${{ inputs.maven-deploy-args }} ${{ inputs.maven-additional-args }}
      shell: bash
